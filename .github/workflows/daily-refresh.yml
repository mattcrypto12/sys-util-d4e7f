name: Daily Refresh

# Daily deal-data refresh for the private source repo. The work is split into
# five sequential jobs (~450 min/day; this repo is public, so
# the minutes are free) so no single job approaches GitHub's 6h job limit. Each
# job continues from a shared Redis offset (cron:gh:full:offset), so the cycle
# picks up exactly where the previous job stopped. If a cycle needs more than
# the combined budget, the offset persists and the next scheduled run resumes it.
#
# Why this file replaced scheduled-refresh.yml (Oct 2026): GitHub disables a
# repo's scheduled workflows after 60 days without a commit, and the old file
# had been sitting in `disabled_inactivity` since Aug 31. A workflow at a new
# path is enabled by default. keepalive.yml now prevents a repeat.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Never let two daily runs overlap — they share one Redis offset.
concurrency:
  group: scheduled-refresh
  cancel-in-progress: false

jobs:
  part-1:
    uses: ./.github/workflows/_refresh-part.yml
    secrets: inherit
    with:
      continue_only: false   # only the first job may start a new cycle
      budget_seconds: 5400   # ~90 min

  part-2:
    needs: part-1
    uses: ./.github/workflows/_refresh-part.yml
    secrets: inherit
    with:
      continue_only: true
      budget_seconds: 5400   # ~90 min

  part-3:
    needs: part-2
    uses: ./.github/workflows/_refresh-part.yml
    secrets: inherit
    with:
      continue_only: true
      budget_seconds: 5400   # ~90 min

  part-4:
    needs: part-3
    uses: ./.github/workflows/_refresh-part.yml
    secrets: inherit
    with:
      continue_only: true
      budget_seconds: 5400   # ~90 min

  part-5:
    needs: part-4
    uses: ./.github/workflows/_refresh-part.yml
    secrets: inherit
    with:
      continue_only: true
      budget_seconds: 5400   # ~90 min
