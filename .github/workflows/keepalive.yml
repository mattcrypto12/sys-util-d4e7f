name: Keepalive

# GitHub silently disables every `schedule:` trigger in a repository after
# 60 days without a commit. This repo exists only to run scheduled jobs, so
# once a week we check the age of the last commit and, past 40 days, push an
# empty commit to reset the inactivity clock. (The daily refresh was disabled
# this way on Aug 31 2026 and sat idle for five weeks before anyone noticed.)
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Push an empty commit if the repo has been quiet for 40+ days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "$age_days" -lt 40 ]; then
            echo "Recent activity — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — prevent scheduled-workflow auto-disable"
          git push
